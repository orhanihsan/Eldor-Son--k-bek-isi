<title>Eldor: Son Işık Bekçisi</title>
<style>
:root{--ink:#f4efe0;--gold:#ffc766;--night:#0a0f2e;box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;justify-content:space-between;font-size:17px;pointer-events:none;text-shadow:0 1px 6px #000}
#say{position:fixed;left:14px;right:14px;top:calc(46px + env(safe-area-inset-top,0px));padding:10px 14px;background:rgba(10,15,46,.78);border-left:3px solid var(--gold);font-size:17px;line-height:1.4;opacity:0;transition:opacity .5s;pointer-events:none}

#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1b2a6b,#070a1c);text-align:center;padding:26px;gap:16px}

button{font:inherit;font-size:20px;padding:12px 34px;border:0;border-radius:6px;background:var(--gold);color:#241800}

#say{border:1px solid rgba(255,199,102,.3);border-left:3px solid var(--gold);border-radius:10px;backdrop-filter:blur(8px);font-style:italic}
#ov{background:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),radial-gradient(1px 1px at 40% 80%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 65%,#fff,transparent),radial-gradient(1px 1px at 10% 70%,#fff,transparent),radial-gradient(circle at 50% 25%,#2a3f9a,#070a1c 70%)}

button{background:linear-gradient(#ffd98a,#ffb347);box-shadow:0 0 22px rgba(255,199,102,.45);border-radius:30px;padding:13px 40px}
#joy{backdrop-filter:blur(3px)}

#fs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));width:48px;height:48px;padding:0;border-radius:50%;font-size:24px;background:rgba(10,15,46,.6);color:#ffc766;border:2px solid rgba(255,199,102,.5);box-shadow:none}
#rot{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));display:none;padding:8px 16px;border-radius:20px;background:rgba(10,15,46,.7);border:1px solid rgba(255,199,102,.4);font-size:15px;pointer-events:none;white-space:nowrap;animation:rf 7s forwards}

#hud{left:calc(14px + env(safe-area-inset-left,0px));right:calc(14px + env(safe-area-inset-right,0px))}
#joy{left:calc(22px + env(safe-area-inset-left,0px))}
#ar{right:calc(28px + env(safe-area-inset-right,0px))}

#joy{width:clamp(110px,28vmin,150px);height:clamp(110px,28vmin,150px)}
#knob{left:50%;top:50%;width:42%;height:42%;transform:translate(-50%,-50%)}
@media (orientation:landscape){#joy{bottom:calc(18px + env(safe-area-inset-bottom,0px))}#ar{width:48px;height:48px;font-size:22px;bottom:calc(24px + env(safe-area-inset-bottom,0px))}#fs{width:42px;height:42px;font-size:20px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}#cnt,#ch{font-size:15px;padding:4px 12px}}
#fs{left:auto;transform:none;bottom:auto;top:calc(8px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right));width:40px;height:40px;font-size:20px}
#hud{right:calc(max(14px,env(safe-area-inset-right)) + 52px)}
#mn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));padding:8px 24px;font-size:17px;border-radius:24px;background:rgba(10,15,46,.65);color:#ffc766;border:1px solid rgba(255,199,102,.5);box-shadow:none}
#menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,8,22,.8);backdrop-filter:blur(6px);padding:16px;box-sizing:border-box}

@media (orientation:landscape){#fs{width:38px;height:38px;font-size:18px;bottom:auto}#mn{bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:6px 20px;font-size:15px}}

#bb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom,0px));width:min(52vw,340px);display:none;text-align:center;font-size:15px;text-shadow:0 1px 6px #000;pointer-events:none}

#atk{position:fixed;right:max(22px,env(safe-area-inset-right));bottom:calc(128px + env(safe-area-inset-bottom,0px));width:70px;height:70px;padding:0;border-radius:50%;font-size:32px;display:none;align-items:center;justify-content:center;box-shadow:0 0 26px rgba(255,199,102,.7);touch-action:none}
@media (orientation:landscape){#bb{bottom:calc(52px + env(safe-area-inset-bottom,0px))}#atk{bottom:calc(84px + env(safe-area-inset-bottom,0px));width:64px;height:64px}}
#ult{position:fixed;right:max(22px,env(safe-area-inset-right));bottom:calc(210px + env(safe-area-inset-bottom,0px));width:64px;height:64px;padding:0;border-radius:50%;font-size:28px;display:none;align-items:center;justify-content:center;color:#fff;background:conic-gradient(#fff2a8 calc(var(--p,0)*1%),rgba(10,15,46,.75) 0);border:2px solid rgba(255,199,102,.6);box-shadow:none;touch-action:none}

.cine #joy,.cine #mn,.cine #hud,.cine #ar,.cine #fs,.cine #atk,.cine #ult,.cine #bb,.cine #vig,.cine #say{display:none!important}

</style>

<script>
const $=id=>document.getElementById(id);
const PRO=["Çok eskiden gökyüzünde Eldor adaları yüzerdi. Her adanın ortasında bir fener yanar, geceyi yıldız tozuyla aydınlatırdı.","Sonra bir gece Sükût geldi. Ne sesi vardı ne yüzü. Fenerleri tek tek söndürdü, yıldızları parçalayıp adalara savurdu.","Sen, son Işık Bekçisi’sin. Elinde küçük bir fener var, yanında ışıktan doğmuş Pırıl. “Her adada yıldız parçalarını topla, feneri yak. Sükût’un nereden geldiğini yolda öğreneceğiz.”"];
const CH=[
{n:"1. Eldor Adası",in:"Evin. Fener sönük, yıldız parçaları çimenlerde parlıyor.",bg:0x0a0f2e,gr:0x2f6b52,tr:0x1f5a3e,k:5,w:0,sp:0,
 L:["Pırıl: İşte ilk parça! Fenerin sıcaklığını hissediyor musun?","Pırıl: Bu adada gölge yok. Sükût buraya henüz uğramamış.","Kuledeki yazı: “Işık yalnız yanmaz, taşıyan olmadan söner.”","Pırıl: Dördüncü parça. Ellerin parlıyor, fark ettin mi?","Pırıl: Sonuncusu! Şimdi kuleye koş!"],
 O:["Fener yandı. Işık göğe yükseldi ve karanlıkta uzaktan bir köprü belirdi.","Fener sana yeni bir güç verdi: IŞIK ATIŞI! Sağ alttaki ✦ düğmesine bas ya da basılı tut. Işık en yakın düşmana doğru fırlar.","Pırıl: “Fısıltı Ormanı söndüğünde ağaçlar sustu. Orada Sükût’un goblinleri dolaşıyor. Seni görünce peşine düşer, etrafını sarmaya çalışırlar. Kulenin ışığına giremezler.”"]},
{n:"2. Fısıltı Ormanı",in:"Ağaçlar fısıldıyor. Goblinler seni görürse peşine düşer. Kulenin ışığı onları uzak tutar.",bg:0x07160f,gr:0x1f5a3a,tr:0x0f3d28,k:6,w:2,sp:3.2,
 L:["Ağaçlar fısıldıyor: “Bir Bekçi vardı… adı Mira.”","Pırıl: Bir goblin seni gördü! Etrafını sarmaya çalışıyorlar, hareket et!","Gövdede kazıma: “Mira fenerleri tek başına taşıdı.”","Pırıl: Mira ilk Işık Bekçisi’ydi. Bir gece kayboldu, kimse nereye gittiğini bilmiyor.","Fısıltı: “Yalnızlık en ağır yüktür.”","Pırıl: Son parça! Gölgelerden kaç, kuleye!"],
 O:["Orman fenerle uyandı. Yapraklar altın rengine döndü, goblinler korkuyla kaçıştı.","Pırıl: “Mira’nın izi bir sonraki adaya gidiyor. Ayna Gölü’ne.”"]},
{n:"3. Ayna Gölü",in:"Suda gökyüzü ters yansıyor. Goblinler burada daha çok.",bg:0x160e2a,gr:0x4a4f8a,tr:0x6a5acd,k:7,w:3,sp:3.6,
 L:["Gölde kendi yansımanı görüyorsun. Yansıma gülümsemiyor.","Pırıl: Bu goblinler öfkeli değil… üzgünler. Neden?","Suyun altında bir sahne: Mira, sönmüş bir feneri tutmuş, ağlıyor.","Mira’nın sesi: “Hiçbir fener tek başıma yetmedi. Herkes beni bekledi, ben kimseyi bekleyemedim.”","Pırıl: Sükût… Mira’nın geride bıraktığı yalnızlık mı?","Yansıman elini uzatıyor. Bu kez sen de uzatıyorsun.","Pırıl: Yedinci parça! Son adaya yolumuz açılıyor."],
 O:["Göl ışıkla doldu. Yansımalar dağıldı ve suyun üstünde gümüş bir yol çizildi.","Pırıl: “Sükût Kalesi’ne gidiyoruz. Ona saldırmayacağız. Onu anlayacağız.”"]},
{n:"4. Sükût Kalesi",in:"Hiç ses yok. Kendi adımlarını bile duymuyorsun.",bg:0x04040a,gr:0x2c2c40,tr:0x3a3a55,k:8,w:4,sp:4.2,
 L:["Pırıl: Korkma. Sessizlik düşman değil, yalnızca yalnız.","Duvarda Mira’nın günlüğü: “Işığı taşıdıkça kendi gölgemi unuttum.”","Günlük: “Gölgem benden ayrıldı. Ona sarılmadım, kaçtım.”","Pırıl: Sükût, Mira’nın terk ettiği gölgesi!","Günlük: “Ona yıldız vermeliyim ama elimde kalmadı.”","Pırıl: Parçaların hepsi sende. Ona verebilirsin.","Pırıl: Yedi parça tamam. Bir tane kaldı.","Pırıl: Sonuncusu. Kuleye git… ama dikkat, kale titriyor."],
 boss:0,bn:"Gölge Kral",hp:30,
 B:["Son parçayı kuleye yerleştirdiğin an zemin titredi. Gökyüzü yarıldı ve uzaktaki adalar karanlığa gömüldü. Sükût adaları, ışığın gücünü ve yıldızları yok etmişti.","Yerden devasa bir gölge yükseldi: Gölge Kral, Sükût’un ilk muhafızı. “Işığın son taşıyıcısı mı? Burada biter.”","Pırıl: “Sağ alttaki ✦ ile ışık fırlat. Kırmızı halkalardan kaç!”","Kuleden gelen ışık sana ULTİ gücünü verdi! Dolunca ⚡ düğmesine bas: lazer gibi bir ışık hüzmesi fırlar. Güç zamanla kendiliğinden dolar."],
 O:["Gölge Kral dumanlara karışıp dağıldı. Ama karanlık geri çekilmedi.","Fenerin ışığıyla yeni bir köprü açıldı. Köprünün ucunda yüzlerce kırmızı göz parladı: Sükût’un yandaşları geldi.","Pırıl: “Yıldızları geri almak için adaları tek tek kurtarmalıyız. Hazır ol, Bekçi.”"]},
{n:"5. Kül Vadisi",in:"Yanık toprak, uçuşan kül. Goblinler çok daha kalabalık.",bg:0x160a0c,gr:0x4a3a35,tr:0x6a4a3a,k:8,w:5,sp:4.4,boss:1,bn:"Hayalet Sihirbaz",hp:36,
 L:["Pırıl: Bu ada kor halindeydi. Yıldız parçaları külün altında parlıyor.","Yanmış bir bayrak: “Eldor’un nöbetçileri burada düştü.”","Pırıl: Goblinler çoğaldı. Işık atışı ✦ seninle!","Kalıntıda yazı: “Sükût sessizce gelmez; yandaşları ateşle gelir.”","Pırıl: Yarısı tamam. Kızıl gök sönmeden devam et!","Pırıl: Bir ses duyuyorum… asa gibi bir şey yere vuruyor.","Pırıl: Son parça! Kulenin yanında biri bizi bekliyor."],
 B:["Kule yandığında kül fırtınası dindi ama havada soğuk bir fısıltı kaldı.","Sisin içinden uzun, kapüşonlu bir figür süzüldü: Hayalet Sihirbaz, Sükût’un ikinci muhafızı. “Işığını söndürmeye geldim, Bekçi.”","Pırıl: “Etrafında dönen karanlık kürelere dikkat! Ulti dolunca ⚡ ile lazeri bırak.”"],
 O:["Hayalet Sihirbaz sisle dağıldı; asası ikiye bölünüp külün içine düştü.","Fener yandı. Uzaktaki gökyüzü kızıl bir fırtınayla doldu: Sükût’un yandaşları geldi, hem de hepsi bir arada.","Pırıl: “Bu sadece ikincisiydi. Donmuş Zirve seni bekliyor.”"]},
{n:"6. Donmuş Zirve",in:"Buz tutmuş bir ada. Rüzgâr kulaklarını kesiyor.",bg:0x08121f,gr:0x7a9ab5,tr:0xa9d4ea,k:8,w:5,sp:4.6,boss:2,bn:"Karanlık Golem",hp:40,
 L:["Pırıl: Buz bile ışığa karşılık veriyor, parçalar buzun içinde parlıyor.","Buzda bir yansıma: Mira, son fenerini tutuyor.","Pırıl: Goblinler burada daha hızlı. Ama sen daha akıllısın.","Donmuş tabelada yazı: “Karanlık ağır bir yüktür; ışık paylaşılır.”","Pırıl: Yarıdan fazlası bitti. Kuleden uzaklaşma!","Pırıl: Zemin titriyor… dev bir şey uyanıyor.","Pırıl: Son parça! Golem’i sakın hafife alma."],
 B:["Kule yanınca zemin sarsıldı. Buzun altından taştan bir yığın yükseldi: Karanlık Golem, Sükût’un üçüncü muhafızı.","Çatlaklarından mor ışık sızıyordu. Tek kırmızı gözü seni buldu.","Pırıl: “Yavaş ama çok sert vuruyor. Kırmızı alanlardan uzak dur. Işık atışı ve ultiyle çatlaklarını parçala!”"],
 O:["Golem taşlarına ayrılıp dağıldı; mor ışık çatlaklarından sönerek akıp gitti.","Pırıl: “Son bir boss kaldı, Bekçi. Adaların geleceği ve ışığın gücü artık senin elinde. Adaları kurtar!”"]},
{n:"7. Karanlığın Kalbi",in:"Kırmızı bir gökyüzü. Burası Sükût’un ana üssü.",bg:0x0d0308,gr:0x2a1a2a,tr:0x3a2040,k:8,w:6,sp:4.8,boss:3,bn:"Sükût",hp:48,
 L:["Pırıl: Burada ışık neredeyse yok. Fenerine güven.","Duvarlarda Mira’nın çizimleri var: yalnız bir bekçi, sönen fenerler.","Pırıl: Sükût yalnızlıktan doğdu. Şimdi ise yıkım makinesi.","Fısıltı: “Işığı taşıyan her zaman yalnız kalır…”","Pırıl: Yalan! Sen yalnız değilsin, Bekçi.","Pırıl: Son ikisi kaldı. Goblinler çılgın!","Pırıl: Son parça. Karanlığın kendisi kulede bekliyor."],
 B:["Son parçayı kuleye koyduğunda gökyüzü kana boyandı. Karanlık, tek bir dev gölgede toplandı.","Sükût: “Beni geride bırakan ışığı yok edeceğim. Tüm adaları, tüm yıldızları!”","Pırıl: “Bu son savaş. Bütün gücünü kullan, Bekçi!”"],
 O:["Sükût çığlık atarak parçalandı. Karanlık geri çekildi ama adalar hâlâ harabe halindeydi.","Pırıl: “Işık senin içinde, Bekçi. Kuleyi içindeki ışıkla parlatırsan adaları onarabilirsin… ama bunun için kendini adalarla birleştirmen gerek.”","Gözlerini kapattın ve içindeki ışığı kuleye bırakmaya karar verdin."]},
{n:"8. Işığın Birleşmesi",in:"Kuleye yürüdün. Artık geri dönüş yok. Gözlerini kapat ve ışığı bırak.",bg:0x05030a,gr:0x1d1626,tr:0x2a1f38,k:0,w:0,sp:0,cine:1,L:[],O:[]}];
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.1;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x0a0f2e);S.fog=new THREE.Fog(0x0a0f2e,30,110);
const C=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,400);
let camD=12.3,camY=6.7,camLook=2,camAuto=.5,camUser=0,camMode=-1,camZ=1;
